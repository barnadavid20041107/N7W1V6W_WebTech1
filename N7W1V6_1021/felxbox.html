<!DOCTYPE html>
<html>
<html lang="hu">
<head>

    <meta charset="UTF-8">
    <title>CSS Gap - Flexbox</title>
    <style>
        #flex-container {
            border: 3px solid black;
            background-color: rgb(200, 100, 191);
            display :flex;
            flex-wrap:wrap;
            gap: 20px, 70px;
        }
        #flex-container > div {
            border: 2px solid black;
            width: 10%;
            aspect-ratio: 2;
            padding: 10px;
            background-color: yellow;
        }
        </style>

        </head>
<body> 
    <h2>A gap tulajdonság flexbox segítségével</h2>
    <p>A gap tulajdonsággal adható meg a sorok és oszlopok közötti távolság egy flexbox elrendezésben.</p>

    <p style= "font-family:verdana; font-size: 1.5rem">A flexbox elrendezésnél a sorok között 20 px, az oszlopok között pedig 70 px a távolság.</p>

    <div id=" flex-container">
    <div>  1 </div>
    <div>  2 </div>
    <div>  3 </div>
    <div>  4 </div>
    <div>  5 </div>
    <div>  6 </div>
    <div>  7 </div>
    <div>  8 </div>
</div>
</body>
</html>
