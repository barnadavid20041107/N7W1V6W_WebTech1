<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Gap - Rács</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            row-gap: 20px;
            column-gap: 50px;
            background-color: #8dbd9d;
            padding: 10px;
        }
        .grid-item {
            background-color: #e6f200;
            border: 1px solid #777;
            padding: 5px;
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
    
</head>
<body>

    <div>  1 </div>
    <div>  2 </div>
    <div>  3 </div>
    <div>  4 </div>
    <div>  5 </div>
    <div>  6 </div>
    <div>  7 </div>
    <div>  8 </div>
    
    
</body>

</html>
