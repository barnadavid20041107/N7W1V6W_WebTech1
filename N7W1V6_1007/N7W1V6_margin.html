<!DOCTYPE html>
<html lang="hu">
    
<head>
    <meta charset="UTF-8">
    <title>Margin Example</title>
    <style>

        h1 {
            margin-bottom: 40px;
        }
        div {
            background-color: #fef9e7;
            border: 1px solid #f10f0f;
            margin: 20px 50px;
        }

    </style>

</head>

<body>

    <h1>Külső margó (Margin) feladat</h1>
    <div>Ez a DIV elem külső margóval van elkülönítve a többi elemtől.</div>

</body>
</html>
