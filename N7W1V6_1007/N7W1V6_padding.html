<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Padding Example</title>
    <style>
        h1 {
            padding-left: 10px;
            background-color: #ecf0f1;
        }
        div {
            background-color: #e8f8f5;
            border: 1px solid #1abc9c;
            padding: 50px;
        }
    </style>
</head>
<body>

    <h1>Belső margó (Padding) feladat</h1>

    <div>Ez a DIV elem belső margót kapott, így a szöveg nem tapad a kerethez.</div>

</body>

</html>
