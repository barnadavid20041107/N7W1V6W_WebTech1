<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Border Example</title>
    <style>
        h1 {
            border-bottom: 3px solid #2980b9;
        }
        div {
            border: 2px dashed #e67e22;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Szegély stílusok demonstrációja</h1>
    <div>Ez a DIV elem egy szaggatott vonalú kerettel van ellátva.</div>
</body>
</html>
