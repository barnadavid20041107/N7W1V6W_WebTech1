<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Color and Font Size</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #2c3e50;
            font-size: 28px;
        }
        div {
            color: #34495e;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Szín és betűméret beállítások</h1>
    <div>Ez egy minta mondat a DIV elemben, amely a beállított betűszínt és betűméretet szemlélteti.</div>
</body>
</html>
