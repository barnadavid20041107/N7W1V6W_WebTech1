<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>HTML5 Űrlap - N7W1V6</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #111111;
        }
        header {
            background-color: #1e4d6b;
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 6px 6px 0 0;
            text-align: center;
        }
        section {
            background-color: #3b7a94;
            color: #ffffff;
            padding: 20px;
            border-radius: 0 0 6px 6px;
        }
        .sor {
            margin-bottom: 12px;
        }
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"],
        input[type="number"] {
            padding: 5px 8px;
            border: 1px solid #333333;
            border-radius: 3px;
        }
        .gombok {
            margin-top: 16px;
        }
        button {
            padding: 6px 14px;
            margin-right: 10px;
            cursor: pointer;
        }
        footer {
            margin-top: 20px;
            padding: 12px 16px;
            background-color: #e2e8f0;
            border-top: 2px solid #1e4d6b;
            font-size: 14px;
        }
        footer a {
            color: #1e4d6b;
        }
    </style>
</head>
<body>
    <header>
        <h1>HTML5 Űrlap - N7W1V6</h1>
    </header>

    <section>
        <form id="urlap" action="feldolgozo.php" method="post">
            <div class="sor">
                <label for="nev">Név:</label>
                <input type="text" id="nev" name="nev" placeholder="Ird be a neved" autocomplete="off" autofocus required pattern="[A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüű\s\-]{2,50}" title="Csak betűket, szóközt és kötőjelet adhat meg (2-50 karakter).">
            </div>

            <div class="sor">
                <label for="pin">PIN kód:</label>
                <input type="password" id="pin" name="pin" placeholder="PIN kod" autocomplete="off" required pattern="[0-9]{4,6}" title="4-6 számjegyből álló PIN kódot adjon meg.">
            </div>

            <div class="sor">
                <label for="gyumolcs">Kedvenc gyümölcs:</label>
                <input type="text" id="gyumolcs" name="gyumolcs" list="gyumolcs-lista" placeholder="Válasszon vagy írjon be">
                <datalist id="gyumolcs-lista">
                    <option value="alma" label="250Ft/kg"></option>
                    <option value="körte" label="380Ft/kg"></option>
                    <option value="banán" label="490Ft/kg"></option>
                    <option value="szilva" label="320Ft/kg"></option>
                    <option value="narancs" label="550Ft/kg"></option>
                </datalist>
            </div>

            <div class="sor">
                <label for="eletkor">Életkor:</label>
                <input type="number" id="eletkor" name="eletkor" min="1" max="100" step="1">
            </div>

            <div class="sor">
                <label for="labmeret">Lábméret:</label>
                <input type="number" id="labmeret" name="labmeret" min="25" max="50" step="0.5">
            </div>

            <div class="sor">
                <label for="onbizalom">Önbizalom:</label>
                <input type="range" id="onbizalom" name="onbizalom" min="0" max="100" value="50">
            </div>
        </form>

        <div class="gombok">
            <button type="submit" form="urlap">Elküld</button>
            <button type="submit" form="urlap" formnovalidate>Elküld ellenőrzés nélkül</button>
        </div>
    </section>

    <footer>
        <p>Forrás: <a href="http://html5doctor.com/" target="_blank">http://html5doctor.com/</a></p>
        <p>Formátumok: <a href="https://www.html5pattern.com/" target="_blank">https://www.html5pattern.com/</a></p>
        <p>JavaScript RegExp: <a href="https://www.w3schools.com/jsref/jsref_obj_regexp.asp" target="_blank">https://www.w3schools.com/jsref/jsref_obj_regexp.asp</a></p>
    </footer>
</body>
</html>
