<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>CSS - text-decoration</title>
    <style>
        .link-dekor {
            text-decoration: none;
            color: blue;
        }
        .pontozott-alahuzas {
            text-decoration: underline dotted red;
            color: red;
        }
    </style>
</head>
<body>
    <h1>CSS - text-decoration</h1>
    <p>
        <a href="https://unithe.hu" target="_blank" class="link-dekor">Kattins ide a unithe.hu weblap megnyitásához!</a>
    </p>
    <p class="pontozott-alahuzas">Egy piros pontozott vonallal aláhúzott szöveg</p>
</body>
</html>
