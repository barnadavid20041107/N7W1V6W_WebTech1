<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Relatív mértékegység - EM</title>
    <style>
        body {
            font-size: 16px;
        }
        p {
            font-size: 0.75em;
        }
        div {
            font-size: 1.25em;
        }
        h2 {
            font-size: 2.5em;
        }
        h3 {
            font-size: 5em;
        }
    </style>
</head>
<body>
    <p>Bekezdés - 12px</p>
    <div>DIV-en belüli szöveg - 20px</div>
    <h2>Második szint - 40px</h2>
    <h3>Harmadik szint - 80px</h3>
</body>
</html>
