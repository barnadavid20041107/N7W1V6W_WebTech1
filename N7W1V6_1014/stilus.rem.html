<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Relatív mértékegység - REM</title>

        html {
            font-size: 16px;
        }
        div {
            font-size: 1rem;
        }
        h1 {
            font-size: 2rem;
        }
        p {
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div>DIV-en belüli szöveg - 16px</div>
    <h1>Első címsor - 32px</h1>
    <p>Bekezdés - 12px</p>
</body>
</html>
