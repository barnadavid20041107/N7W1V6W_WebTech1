<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>JSON megvalósítása - JavaScript</title>
</head>
<body>
    <h1>JSON megvalósítása – JavaScript</h1>
    <h2>Könyvek listája</h2>
    <ul id="konyvLista"></ul>

    <script>
        const konyvAdat = {
            "konyvek": {
                "konyv": [
                    {
                        "iro": "Nyékyné Dr. Gaizler Judit",
                        "cim": "Java 2 I-II. - Útikalauz programozóknak 5.0",
                        "kiadas": 2009
                    },
                    {
                        "iro": "Reiter István",
                        "cim": "C# programozás lépésről lépésre",
                        "kiadas": 2018
                    }
                ]
            }
        };

        const listaElem = document.getElementById("konyvLista");
        const konyvekTomb = konyvAdat.konyvek.konyv;

        for (let i = 0; i < konyvekTomb.length; i++) {
            const li = document.createElement("li");
            li.textContent = "Szerző: " + konyvekTomb[i].iro + " cim: " + konyvekTomb[i].cim + " Kiadás éve: " + konyvekTomb[i].kiadas;
            listaElem.appendChild(li);
        }
    </script>
</body>
</html>
